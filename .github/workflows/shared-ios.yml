# K1.2: the shared Kotlin Multiplatform module (shared/) tested as iPhone code, on an iOS simulator.
# macOS runners are slow, so this runs only when shared code, the build files or this workflow change, and a newer push cancels an older run.
name: Shared iOS

on:
  pull_request:
    paths: ['shared/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/shared-ios.yml']
  push:
    branches: [master]
    paths: ['shared/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/shared-ios.yml']
  workflow_dispatch:

concurrency:
  group: shared-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native compiler and its dependencies live in ~/.konan: without this cache every run downloads them again.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Gradle configures every module, and :app refuses to configure without the sherpa-onnx library (C36). Same cache key as ci.yml.
      - uses: actions/cache@v6
        with:
          path: app/libs
          key: sherpa-${{ hashFiles('scripts/fetch-sherpa.sh') }}

      - name: Fetch the sherpa-onnx library
        run: scripts/fetch-sherpa.sh

      - name: Shared tests on the iOS simulator
        run: |
          start=$SECONDS
          ./gradlew --console=plain :shared:iosSimulatorArm64Test
          echo "Shared iOS tests: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Say which tests ran
        if: always()
        run: |
          for f in shared/build/test-results/iosSimulatorArm64Test/*.xml; do
            [ -f "$f" ] && grep -E '<testsuite ' "$f" | cut -c1-300
          done || true
