# The shared-code spike (spike-kmp/): does Kotlin + Compose Multiplatform build for the iPhone from a Windows-only workflow, and how long does it take?
# macOS minutes cost 10x on a private repository: this runs only when started by hand or when spike-kmp/ changes on the spike branch.
name: Spike KMP iOS

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Run the Kotlin tests on the iOS simulator first (about 7 Mac minutes)
        type: boolean
        default: true
  push:
    branches: [spike-kmp-ios]
    paths: ['spike-kmp/**', '.github/workflows/spike-kmp-ios.yml']

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spike-kmp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native compiler and its dependencies live in ~/.konan: without this cache every run downloads them again.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('spike-kmp/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Kotlin tests on the iOS simulator (the shared code, running as iPhone code)
        if: github.event_name == 'workflow_dispatch' && inputs.tests
        continue-on-error: true
        run: |
          start=$SECONDS
          ./gradlew --console=plain :composeApp:iosSimulatorArm64Test
          echo "ios_tests_seconds=$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Say which tests failed, and why
        if: always()
        run: |
          for f in composeApp/build/test-results/iosSimulatorArm64Test/*.xml; do
            [ -f "$f" ] && grep -E '<testsuite |<failure' "$f" | cut -c1-600
          done || true

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build the app for the iPhone simulator (no signing)
        run: |
          set -eo pipefail
          start=$SECONDS
          echo "konan_cache_present=$([ -d ~/.konan ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/xcode ARCHS=arm64 EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build | tail -60
          echo "xcode_build_seconds=$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Launch it in a simulator and take a picture (best effort)
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          xcrun simctl boot "$udid"
          xcrun simctl install "$udid" build/xcode/Build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl privacy "$udid" grant microphone com.example.edithkmpspike
          # A fake streaming Ollama on the runner, so the app's chat reader is tested on the simulator (the owner's real phone showed it hanging).
          python3 tools/fake_ollama.py 2> "$RUNNER_TEMP/fake-ollama.txt" &
          sleep 1
          SIMCTL_CHILD_SPIKE_CHAT_URL=http://127.0.0.1:18080 SIMCTL_CHILD_SPIKE_AUTOPROBE=1 xcrun simctl launch --stdout="$RUNNER_TEMP/app-out.txt" --stderr="$RUNNER_TEMP/app-err.txt" "$udid" com.example.edithkmpspike
          # The first start on a fresh simulator is slow (the GPU shaders compile): wait until the probes have all printed, or 90 seconds.
          for i in $(seq 1 45); do grep -q "Navigation and ViewModel" "$RUNNER_TEMP/app-out.txt" 2>/dev/null && break; sleep 2; done
          sleep 3
          echo "--- fake Ollama saw ---"; cat "$RUNNER_TEMP/fake-ollama.txt" 2>/dev/null
          echo "--- what the app printed ---"; cat "$RUNNER_TEMP/app-out.txt" "$RUNNER_TEMP/app-err.txt" 2>/dev/null | tail -40
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/spike.png"
          cp "$RUNNER_TEMP/spike.png" build/spike.png
          # Did it stay up? If not, say why: the app's own log and any crash report.
          xcrun simctl spawn "$udid" launchctl list | grep -i edithkmp || echo "the app is NOT running"
          echo "--- app log (last 2 minutes) ---"
          xcrun simctl spawn "$udid" log show --last 2m --style compact --predicate 'process == "iosApp"' | tail -60 || true
          echo "--- crash reports ---"
          mkdir -p build/crash
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*iosApp* 2>/dev/null | head -2); do echo "== $f"; head -80 "$f"; cp "$f" build/crash/; done

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: spike-ios
          path: |
            spike-kmp/build/spike.png
            spike-kmp/build/crash/**
            spike-kmp/composeApp/build/reports/**
            spike-kmp/composeApp/build/test-results/**
          if-no-files-found: ignore
