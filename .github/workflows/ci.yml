# Build, unit tests and lint on every pull request and every push to master — the same checks as
# scripts/check.sh. Debug only: the release signing key never leaves the owner's PC (05-environment.md §6).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper's checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build, unit tests, lint
        run: scripts/check.sh

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
