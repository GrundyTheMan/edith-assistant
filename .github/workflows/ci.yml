# Build, unit tests and lint on every pull request and every push to master — the same checks as
# scripts/check.sh. Debug only (the debug APK is kept as an artifact): the release signing key never leaves the owner's PC (05-environment.md §6).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper's checksum.
      - uses: gradle/actions/setup-gradle@v6

      # C36: the sherpa-onnx library isn't in Git. The cache key holds the script, which pins the version.
      - uses: actions/cache@v6
        with:
          path: app/libs
          key: sherpa-${{ hashFiles('scripts/fetch-sherpa.sh') }}

      - name: Fetch the sherpa-onnx library
        run: scripts/fetch-sherpa.sh

      - name: Build, unit tests, lint
        run: scripts/check.sh

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

      # The debug build, to install on a phone without building it there. Debug-signed (the release key never leaves the owner's PC), so it installs
      # as com.edith.app.debug beside the real app. Built without local.properties, so it has no Google client IDs: Google sign-in says it is not set up.
      - name: Upload the debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: edith-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
