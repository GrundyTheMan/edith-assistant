# The thin iPhone shell around the shared Kotlin code (generated into iosApp.xcodeproj by xcodegen, so no hand-written .pbxproj).
name: iosApp
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Edith KMP Spike
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform throws at start-up on a 120 Hz iPhone without this (found by a crash on a high-refresh simulator).
        CADisableMinimumFrameDurationOnPhone: true
        NSMicrophoneUsageDescription: Edith records your voice memos so the model on your PC can turn them into messages.
        NSLocalNetworkUsageDescription: Edith talks to the model on your PC over your home network.
        NSAppTransportSecurity:
          # Found on a real iPhone: a Tailscale address (100.x) is not a "local network" to iOS, so plain-HTTP Ollama was blocked (error -1022).
          # NSAllowsArbitraryLoads must stand alone: with NSAllowsLocalNetworking also set, iOS ignores it (reproduced on the simulator).
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # A placeholder: the owner picks the real bundle identifier (decision D34) when this goes on a phone.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.edithkmpspike
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        CODE_SIGN_STYLE: Automatic
        # iPhone only: the spike has no iPad layout, and an iPad build would also need every orientation and an iPad icon.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Compile the Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
