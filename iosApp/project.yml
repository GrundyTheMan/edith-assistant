# The thin iPhone shell around the shared Kotlin code (K4.1; generated into iosApp.xcodeproj by xcodegen, so no hand-written .pbxproj).
# Swift here only shows what Kotlin builds: the framework EdithUI comes from the :ui module (the shared screens and, through it, the engine).
name: iosApp
options:
  deploymentTarget:
    iOS: "17.0"   # decision D44
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Edith
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform throws at start-up on a 120 Hz iPhone without this (found by a crash in the Phase 0 spike).
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: Edith talks to the model on your PC over your home network.
        EdithGoogleClientId: ""   # Google's iOS client ID (docs/google-setup.md); empty: Google sign-in says it is not set up
        EdithMicrosoftClientId: ""   # Edith's Microsoft app registration (docs/microsoft-setup.md, with the iOS platform and this bundle id); empty: Microsoft sign-in says it is not set up
        NSAppTransportSecurity:
          # Found on a real iPhone in Phase 0: a Tailscale address (100.x) is not a "local network" to iOS, so plain-HTTP Ollama was blocked (error -1022).
          # NSAllowsArbitraryLoads must stand alone: with NSAllowsLocalNetworking also set, iOS ignores it. Decision D49 will tighten this before release.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # The Phase 0 spike's identifier is reused for the first builds (its App Store Connect record and signing exist). The workflows replace
        # this placeholder with the repository variable SPIKE_BUNDLE_ID; the real com.edith.app waits for decision D43.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.edithkmpspike
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: -framework EdithUI
        CODE_SIGN_STYLE: Automatic
        # iPhone only: there is no iPad layout, and an iPad build would also need every orientation and an iPad icon.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Compile the Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
